# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Start numbering panes and windows from 1
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

bind '"' split-window -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# ---- Pane borders ---------------------------------------------------------
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

# ---- Status bar -----------------------------------------------------------
set -g status-style bg=colour235,fg=colour250

# Window list starts at the far left
set -g status-left ""

# Window list: highlight the active window
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=colour238,fg=colour39,bold] #I:#W #[default]"

# Right side: pane title, then a prominent session name badge
set -g status-right-length 120
set -g status-right "#[fg=colour245]#{=50:pane_title} #[bg=colour39,fg=colour232,bold]  #S  "


set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.tmux/plugins/tpm/tpm'
